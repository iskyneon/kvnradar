worker_processes auto;
events { worker_connections 512; }
http {
  access_log /dev/stdout;
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=agent_sync:10m rate=30r/m;
  upstream api { server central:8080; }
  server {
    listen 18080 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    location = /api/sync {
      limit_req zone=agent_sync burst=10 nodelay;
      limit_except POST { deny all; }
      client_max_body_size 1m;
      proxy_http_version 1.1;
      proxy_set_header Connection close;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://api;
    }
    location / { return 404; }
  }
  server {
    listen 9443 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    auth_basic "KVNRadar";
    auth_basic_user_file /etc/nginx/auth/users;
    location / {
      proxy_pass http://api;
      proxy_set_header Connection close;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
  # Public bootstrap distribution. No agent tokens are served here.
  server {
    listen 18081 ssl;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location /agent/ {
      alias /srv/agent-dist/;
      autoindex off;
      limit_except GET { deny all; }
    }
    location / { return 404; }
  }
}
